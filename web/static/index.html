<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
</head>
<body>
<div class="app">
  <div class="barra-mobile">
    <div class="marca">cortes<b>.</b></div>
    <div class="links-mobile">
      <a href="#episodios" data-tela="episodios">Episódios <span class="cont" id="cont-episodios-m" hidden></span></a>
      <a href="#formatos" data-tela="formatos">Formatos</a>
      <a href="#contas" data-tela="contas">Contas</a>
      <a href="#shorts" data-tela="shorts">Shorts <span class="cont" id="sem-ligacao-m" hidden></span></a>
      <a href="#comparar" data-tela="comparar">Comparar</a>
    </div>
    <button class="atualizar" id="atualizar-todas-m" aria-label="Atualizar">↻ Atualizar</button>
  </div>
  <nav>
    <div class="marca">cortes<b>.</b></div>
    <div class="grupo">Produção</div>
    <a href="#episodios" data-tela="episodios">Episódios <span class="cont" id="cont-episodios" hidden></span></a>
    <a href="#formatos" data-tela="formatos">Formatos</a>
    <div class="grupo">Retorno</div>
    <a href="#contas" data-tela="contas">Contas</a>
    <a href="#shorts" data-tela="shorts">Shorts <span class="cont" id="sem-ligacao" hidden></span></a>
    <a href="#comparar" data-tela="comparar">Comparar</a>
    <div class="fila" id="fila-trilho" hidden></div>
    <div class="contas" id="trilho-contas"></div>
    <div class="erro-coleta" id="erro-coleta" hidden></div>
    <button class="atualizar" id="atualizar-todas">↻ Atualizar todas</button>
  </nav>
  <main id="tela"></main>
</div>
<div class="aviso" id="aviso" role="alert" hidden></div>
<div id="camada"></div>
<!-- prévia do editor: mesma versão do HyperFrames do render (render/hyperframes.py HYPERFRAMES) -->
<script src="https://cdn.jsdelivr.net/npm/@hyperframes/player@0.8.104/dist/hyperframes-player.global.js"></script>
<script src="js/base.js"></script>
<script src="js/comparar.js"></script>
<script src="js/shorts.js"></script>
<script src="js/contas.js"></script>
<script src="js/episodios.js"></script>
<script src="js/player.js"></script>
<script src="js/grade.js"></script>
<script src="js/episodio.js"></script>
<script src="js/transcricao.js"></script>
<script src="js/planos.js"></script>
<script src="js/editor.js"></script>
<script src="js/formatos.js"></script>
<script src="js/inicio.js"></script>
</body>
</html>
